<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Симулятор нейронов: от LIF до Хиндмарша-Роуза</title>
<style>
  :root {
    --bg: #0f1420;
    --panel-bg: #16203a;
    --border: #2a3550;
    --text: #e6e6e6;
    --text-dim: #9fb3d9;
    --accent: #7fd4ff;
    --accent-dark: #3a4a70;
    --danger: #d94848;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app-container {
    display: flex;
    gap: 20px;
    max-width: 1600px;
    width: 100%;
    align-items: flex-start;
  }

  /* === Левое меню === */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: sticky;
    top: 20px;
  }
  .sidebar h2 {
    font-size: 16px;
    margin: 0 0 12px 0;
    color: var(--text-dim);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .model-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
    font-weight: 500;
  }
  .model-btn:hover {
    background: #1e2a45;
    border-color: var(--accent-dark);
  }
  .model-btn.active {
    background: var(--accent-dark);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 10px rgba(127, 212, 255, 0.2);
  }

  /* === Центральная часть === */
  .main-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0; text-align: center; }

  .neuron-wrap {
    padding: 8px 14px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: box-shadow 0.15s, border-color 0.15s;
    width: fit-content;
  }
  .neuron-wrap.firing {
    box-shadow: 0 0 24px rgba(127, 212, 255, 0.55);
    border-color: var(--accent);
  }
  .neuron-svg .neuron-body { fill: #5a6e9e; stroke: #a8c0e8; stroke-width: 1.5; transition: fill 0.15s, stroke 0.15s; }
  .neuron-svg .neuron-axon { stroke: #a8c0e8; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.15s; }
  .neuron-svg .neuron-dendrite { stroke: #a8c0e8; fill: none; stroke-linecap: round; transition: stroke 0.15s; }
  .neuron-svg .nucleus { fill: #7fd4ff; transition: fill 0.15s; }
  .neuron-svg .synapse { fill: #a8c0e8; transition: fill 0.15s; }
  .neuron-wrap.firing .neuron-body { fill: #7fd4ff; stroke: #ffffff; filter: drop-shadow(0 0 12px #7fd4ff); }
  .neuron-wrap.firing .neuron-axon { stroke: #ffffff; filter: drop-shadow(0 0 10px #7fd4ff); }
  .neuron-wrap.firing .neuron-dendrite { stroke: #ffffff; }
  .neuron-wrap.firing .nucleus { fill: #ffffff; }
  .neuron-wrap.firing .synapse { fill: #ffffff; filter: drop-shadow(0 0 8px #7fd4ff); }

  canvas {
    background: #0a0e17;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: block;
  }
  #plotV { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none; }
  #plotI { border-top-left-radius: 0; border-top-right-radius: 0; }

  .readout { font-size: 14px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .readout b { color: var(--accent); font-weight: 600; }

  .controls {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center;
    background: var(--panel-bg); padding: 12px 24px; border-radius: 12px; border: 1px solid var(--border);
  }
  .slider-group { display: flex; align-items: center; gap: 10px; }
  input[type=range] { width: 200px; accent-color: var(--accent); }
  #currentBtn {
    padding: 10px 28px; font-size: 16px; font-weight: 600; border: none; border-radius: 8px;
    background: var(--accent-dark); color: #fff; cursor: pointer; user-select: none;
    transition: background 0.15s;
  }
  #currentBtn.active { background: var(--danger); }
  #currentBtn:active { transform: translateY(1px); }
  .value { font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; color: var(--accent); }

  /* === Правая панель справки === */
  .info-panel {
    width: 320px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.5;
  }
  .info-panel h3 {
    color: var(--accent);
    margin-top: 0;
    margin-bottom: 12px;
    font-size: 18px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .info-panel .paper-ref {
    font-style: italic;
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 16px;
    padding: 8px;
    background: #0f1420;
    border-radius: 6px;
    border-left: 3px solid var(--accent);
  }
  .info-panel .equations {
    background: #0a0e17;
    padding: 12px;
    border-radius: 6px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    overflow-x: auto;
    margin: 12px 0;
    color: #b8e8ff;
    white-space: pre-wrap;
  }
  .info-panel .feature {
    margin-top: 16px;
    padding: 12px;
    background: rgba(127, 212, 255, 0.08);
    border-radius: 6px;
    border: 1px solid rgba(127, 212, 255, 0.2);
  }
  .info-panel .feature strong { color: var(--accent); display: block; margin-bottom: 4px; }
  .info-panel p { margin: 8px 0; color: #c0cce0; }

</style>
</head>
<body>

<div class="app-container">
  <!-- === Левое меню === -->
  <div class="sidebar">
    <h2>Модели</h2>
    <button class="model-btn active" data-model="lif">LIF</button>
    <button class="model-btn" data-model="hh">Ходжкина-Хаксли</button>
    <button class="model-btn" data-model="izh">Ижикевича</button>
    <button class="model-btn" data-model="ml">Морриса-Лекара</button>
    <button class="model-btn" data-model="fh">ФитцХью-Нагумо</button>
    <button class="model-btn" data-model="hr">Хиндмарша-Роуза</button>
  </div>

  <!-- === Центр === -->
  <div class="main-content">
    <h1 id="modelTitle">Модель LIF</h1>

    <div class="neuron-wrap" id="neuronWrap">
      <svg class="neuron-svg" width="400" height="160" viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
        <g id="dendrites"></g>
        <ellipse class="neuron-body" cx="100" cy="80" rx="30" ry="24" />
        <circle class="nucleus" cx="100" cy="80" r="6" />
        <g id="axon"></g>
      </svg>
    </div>

    <canvas id="plotV" width="800" height="280"></canvas>
    <canvas id="plotI" width="800" height="100"></canvas>

    <div class="readout">V = <b id="vNow">-65.0</b> мВ &nbsp;|&nbsp; I = <b id="iNow">0.0</b> &nbsp;|&nbsp; t = <b id="tNow">0.0</b> мс</div>

    <div class="controls">
      <div class="slider-group">
        <label for="amp">Стимул:</label>
        <input type="range" id="amp" min="0" max="100" step="1" value="10">
        <span class="value" id="ampVal">10</span>
      </div>
      <button id="currentBtn">ТОК</button>
    </div>
  </div>

  <!-- === Правая панель справки === -->
  <div class="info-panel" id="infoPanel">
    <!-- Сюда будет вставляться текст через JS -->
  </div>
</div>

<script>
// ===== ГЛОБАЛЬНЫЕ ДАННЫЕ =====
const MODELS = {
  lif: {
    title: 'Модель LIF (Leaky Integrate-and-Fire)',
    params: {
      V: -65, m: 0, h: 0, n: 0, // HH vars
      u: 0, w: 0, x: 0, y: 0, z: 0, // Other vars
      refractory: 0,
      V_th: -50, V_reset: -65, tau_m: 10, R: 10
    },
    info: {
      paper: 'Lapicque, L. (1907). Recherches quantitatives sur l\'excitation électrique des nerfs traitée comme une polarisation. J. Physiol. Pathol. Gen., 9, 620-635. [citation:13]',
      equations: `τ_m * dV/dt = -(V - V_rest) + R * I(t)\n\nЕсли V >= V_th:\n  V = V_reset\n  (и удерживается там τ_refract мс)`,
      feature: 'Простейшая модель. Игнорирует форму спайка, моделирует только моменты генерации. Идеальна для больших сетей.'
    }
  },
  hh: {
    title: 'Модель Ходжкина-Хаксли',
    params: {
      V: -65, m: 0.05, h: 0.6, n: 0.32,
      Cm: 1, gNa: 120, gK: 36, gL: 0.3, ENa: 50, EK: -77, EL: -54.4
    },
    info: {
      paper: 'Hodgkin, A. L., & Huxley, A. F. (1952). A quantitative description of membrane current and its application to conduction and excitation in nerve. The Journal of Physiology, 117(4), 500-544. [citation:8]',
      equations: `C_m dV/dt = I - g_Na m^3 h (V - E_Na) - g_K n^4 (V - E_K) - g_L (V - E_L)\ndm/dt = α_m(V)(1-m) - β_m(V)m\n... (аналогично для h и n)`,
      feature: 'Золотой стандарт биофизики. Описывает динамику натриевых и калиевых каналов. Воспроизводит точную форму потенциала действия.'
    }
  },
  izh: {
    title: 'Модель Ижикевича',
    params: {
      V: -65, u: -14, // u = b*V
      a: 0.02, b: 0.2, c: -65, d: 2,
      V_th: 30
    },
    info: {
      paper: 'Izhikevich, E. M. (2004). Which model to use for cortical spiking neurons? IEEE Transactions on Neural Networks, 15(5), 1063-1070. [citation:3][citation:9]',
      equations: `dv/dt = 0.04v^2 + 5v + 140 - u + I\ndu/dt = a(bv - u)\n\nЕсли v >= 30 mV:\n  v = c\n  u = u + d`,
      feature: 'Компромисс между биологической правдоподобностью HH и вычислительной эффективностью LIF. Воспроизводит 20 типов спайков.'
    }
  },
  ml: {
    title: 'Модель Морриса-Лекара',
    params: {
      V: -60, w: 0.1,
      C: 20, gCa: 4.4, gK: 8, gL: 2, VCa: 120, VK: -84, VL: -60,
      V1: -1.2, V2: 18, V3: 2, V4: 30, phi: 0.04
    },
    info: {
      paper: 'Morris, C., & Lecar, H. (1981). Voltage oscillations in the barnacle giant muscle fiber. Biophysical Journal, 35(1), 193-213. [citation:4][citation:10]',
      equations: `C dV/dt = I - g_Ca m∞(V)(V-V_Ca) - g_K w(V-V_K) - g_L(V-V_L)\ndw/dt = φ * (w∞(V) - w) / τ_w(V)`,
      feature: 'Двумерная модель (быстрая активация Ca, медленная активация K). Отлично подходит для фазового анализа и изучения бифуркаций.'
    }
  },
  fh: {
    title: 'Модель ФитцХью-Нагумо',
    params: {
      V: -1, w: 0,
      a: 0.7, b: 0.8, tau: 12.5, I_ext: 0
    },
    info: {
      paper: 'FitzHugh, R. (1961). Impulses and physiological states in theoretical models of nerve membrane. Biophysical Journal, 1(6), 445-466. [citation:5][citation:11]',
      equations: `dV/dt = V - V^3/3 - w + I\ndw/dt = (V + a - b*w) / τ`,
      feature: 'Качественная модель (редукция HH). Простая 2D система, которая демонстрирует возбудимость и автоколебания (предельный цикл).'
    }
  },
  hr: {
    title: 'Модель Хиндмарша-Роуза',
    params: {
      x: -1.5, y: -8, z: 2,
      a: 1, b: 3, c: 1, d: 5, r: 0.006, s: 4, x_R: -1.6, I: 2.5
    },
    info: {
      paper: 'Hindmarsh, J. L., & Rose, R. M. (1984). A model of neuronal bursting using three coupled first order differential equations. Proc. R. Soc. Lond. B, 221(1222), 87-102. [citation:18][citation:25]',
      equations: `dx/dt = y - a*x^3 + b*x^2 - z + I\ndy/dt = c - d*x^2 - y\ndz/dt = r * (s*(x - x_R) - z)`,
      feature: 'Трёхмерная модель, специально разработанная для описания пачечной активности (bursting) и переходов между покоем и генерацией.'
    }
  }
};

let currentModelKey = 'lif';
let currentModel = MODELS[currentModelKey];

// ===== DOM ЭЛЕМЕНТЫ =====
const modelTitle = document.getElementById('modelTitle');
const infoPanel = document.getElementById('infoPanel');
const ampSlider = document.getElementById('amp');
const ampVal = document.getElementById('ampVal');
const currentBtn = document.getElementById('currentBtn');
const vNowEl = document.getElementById('vNow');
const iNowEl = document.getElementById('iNow');
const tNowEl = document.getElementById('tNow');
const neuronWrap = document.getElementById('neuronWrap');

// ===== ГРАФИКИ =====
const canvasV = document.getElementById('plotV');
const canvasI = document.getElementById('plotI');
const ctxV = canvasV.getContext('2d');
const ctxI = canvasI.getContext('2d');
const WV = canvasV.width, HV = canvasV.height;
const WI = canvasI.width, HI = canvasI.height;
const padL = 50, padR = 15, padT = 15, padB = 30;

// ===== ПЕРЕМЕННЫЕ СИМУЛЯЦИИ =====
let history = [];
let simTime = 0;
let isCurrentOn = false;
let flashUntil = 0;

// Параметры времени
let dt = 0.01; // Базовый шаг
const TIME_SCALE = 8;
let tMax = 100;

// ===== ФУНКЦИИ МОДЕЛЕЙ =====
// Возвращает { dV, dOther } для одного шага
function modelStep(modelKey, params, Iext) {
  const p = { ...params }; // копия для изменений
  let dV = 0, dOther = 0;

  switch(modelKey) {
    case 'lif': {
      if (p.refractory > 0) {
        p.refractory -= dt;
        return { dV: 0, dOther: 0, overrideV: p.V_reset };
      }
      dV = (-(p.V - p.V_reset) + p.R * Iext) / p.tau_m;
      p.V += dV * dt;
      if (p.V >= p.V_th) {
        p.V = p.V_reset;
        p.refractory = 2; // 2 мс рефрактерности
      }
      return { dV: 0, dOther: 0, overrideV: p.V }; // V обновлен внутри
    }
    case 'hh': {
      const alphaM = (v) => 0.1 * (v + 40) / (1 - Math.exp(-(v + 40) / 10));
      const betaM  = (v) => 4.0 * Math.exp(-(v + 65) / 18);
      const alphaH = (v) => 0.07 * Math.exp(-(v + 65) / 20);
      const betaH  = (v) => 1.0 / (1 + Math.exp(-(v + 35) / 10));
      const alphaN = (v) => 0.01 * (v + 55) / (1 - Math.exp(-(v + 55) / 10));
      const betaN  = (v) => 0.125 * Math.exp(-(v + 65) / 80);

      const INa = p.gNa * p.m**3 * p.h * (p.V - p.ENa);
      const IK  = p.gK * p.n**4 * (p.V - p.EK);
      const IL  = p.gL * (p.V - p.EL);
      dV = (Iext - INa - IK - IL) / p.Cm;
      
      const dm = alphaM(p.V)*(1-p.m) - betaM(p.V)*p.m;
      const dh = alphaH(p.V)*(1-p.h) - betaH(p.V)*p.h;
      const dn = alphaN(p.V)*(1-p.n) - betaN(p.V)*p.n;
      
      p.V += dV * dt;
      p.m += dm * dt; p.h += dh * dt; p.n += dn * dt;
      return { dV: 0, dOther: 0, overrideV: p.V, overrideM: p.m, overrideH: p.h, overrideN: p.n };
    }
    case 'izh': {
      const dv = 0.04 * p.V**2 + 5 * p.V + 140 - p.u + Iext;
      const du = p.a * (p.b * p.V - p.u);
      p.V += dv * dt;
      p.u += du * dt;
      if (p.V >= 30) {
        p.V = p.c;
        p.u += p.d;
      }
      return { dV: 0, dOther: 0, overrideV: p.V, overrideU: p.u };
    }
    case 'ml': {
      const m_inf = 0.5 * (1 + Math.tanh((p.V - p.V1) / p.V2));
      const w_inf = 0.5 * (1 + Math.tanh((p.V - p.V3) / p.V4));
      const tau_w = 1 / Math.cosh((p.V - p.V3) / (2 * p.V4));
      
      const ICa = p.gCa * m_inf * (p.V - p.VCa);
      const IK  = p.gK * p.w * (p.V - p.VK);
      const IL  = p.gL * (p.V - p.VL);
      const dV = (Iext - ICa - IK - IL) / p.C;
      const dw = p.phi * (w_inf - p.w) / tau_w;
      
      p.V += dV * dt;
      p.w += dw * dt;
      return { dV: 0, dOther: 0, overrideV: p.V, overrideW: p.w };
    }
    case 'fh': {
      const dV = p.V - p.V**3 / 3 - p.w + Iext;
      const dw = (p.V + p.a - p.b * p.w) / p.tau;
      p.V += dV * dt;
      p.w += dw * dt;
      return { dV: 0, dOther: 0, overrideV: p.V, overrideW: p.w };
    }
    case 'hr': {
      const dx = p.y - p.a * p.x**3 + p.b * p.x**2 - p.z + Iext;
      const dy = p.c - p.d * p.x**2 - p.y;
      const dz = p.r * (p.s * (p.x - p.x_R) - p.z);
      p.x += dx * dt;
      p.y += dy * dt;
      p.z += dz * dt;
      // Для HR V обычно ассоциируют с x, но масштаб другой. 
      // Для отображения на графике умножим на 10 или сдвинем.
      // Оставим как есть, но в readout покажем x.
      return { dV: 0, dOther: 0, overrideV: p.x, overrideY: p.y, overrideZ: p.z };
    }
  }
  return {};
}

// Сброс состояния при смене модели
function resetModelState() {
  const p = currentModel.params;
  // Сброс в начальные значения (можно взять из MODELS)
  const initial = MODELS[currentModelKey].params;
  for (let key in initial) {
    p[key] = initial[key];
  }
  history = [];
  simTime = 0;
  flashUntil = 0;
  // Очистка графиков
  ctxV.clearRect(0, 0, WV, HV);
  ctxI.clearRect(0, 0, WI, HI);
  draw();
}

// ===== UI ОБНОВЛЕНИЕ =====
function updateUIForModel() {
  modelTitle.textContent = currentModel.title;
  
  // Инфо-панель
  const info = currentModel.info;
  infoPanel.innerHTML = `
    <h3>${currentModel.title}</h3>
    <div class="paper-ref">📄 ${info.paper}</div>
    <p><strong>Уравнения:</strong></p>
    <div class="equations">${info.equations}</div>
    <div class="feature">
      <strong>Отличительная особенность:</strong>
      <p>${info.feature}</p>
    </div>
  `;

  // Настройка ползунка под модель (примерные диапазоны)
  if (currentModelKey === 'hh' || currentModelKey === 'ml' || currentModelKey === 'hr') {
    ampSlider.min = 0; ampSlider.max = 50; ampSlider.value = 10;
  } else if (currentModelKey === 'izh') {
    ampSlider.min = 0; ampSlider.max = 20; ampSlider.value = 10;
  } else if (currentModelKey === 'lif') {
    ampSlider.min = 0; ampSlider.max = 30; ampSlider.value = 15;
  } else if (currentModelKey === 'fh') {
    ampSlider.min = -1; ampSlider.max = 2; ampSlider.step = 0.01; ampSlider.value = 0.5;
  }
  ampVal.textContent = ampSlider.value;
}

// Переключение модели
document.querySelectorAll('.model-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    
    currentModelKey = e.target.dataset.model;
    currentModel = MODELS[currentModelKey];
    
    // Восстановим шаг для ползунка
    ampSlider.step = (currentModelKey === 'fh') ? 0.01 : 1;
    
    resetModelState();
    updateUIForModel();
  });
});

// ===== НЕЙРОН (статичный) =====
// (Используем тот же код, что и в прошлой версии, для краткости опустим детали генерации, 
// так как фокус на моделях. Но нейрон останется.)
(function buildNeuron() {
  const gDen = document.getElementById('dendrites');
  const gAxon = document.getElementById('axon');
  if (!gDen || !gAxon) return;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const somaX = 100, somaY = 80, somaRx = 30, somaRy = 24;
  let seed = 42;
  function rand() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  function randRange(a, b) { return a + (b - a) * rand(); }
